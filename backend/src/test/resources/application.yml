spring:
  application:
    name: lorry-owner-backend-test

  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
        format_sql: false
        show_sql: false

server:
  error:
    include-stacktrace: never
    include-message: never

jwt:
  secret: "test_jwt_secret_must_be_at_least_256_bits_for_hmac_sha256_security_testing_only"
  expiration-ms: 3600000

app:
  document:
    upload-dir: target/test-uploads/documents

bootstrap:
  owner:
    username: ""
    password: ""
