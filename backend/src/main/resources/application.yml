server:
  port: ${PORT:8080}
  error:
    # Never expose stack traces or server exception messages through Spring's default error attributes
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: lorry-owner-backend

  datasource:
    # Database credentials read strictly from environment variables
    # Default placeholder values provided for local safety without hardcoding credentials
    url: ${DB_URL:jdbc:mysql://localhost:3306/lorry_fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: LorryOwnerHikariCP

  jpa:
    open-in-view: false
    hibernate:
      # Conservative schema management:
      # 'validate' strictly checks that existing tables match entity definitions without modifying schema.
      # Never use 'create', 'create-drop', or destructive schema changes in production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false

# Spring Boot Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # Do not expose sensitive internal component details publicly
      show-details: when_authorized
