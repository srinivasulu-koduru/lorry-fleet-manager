server:
  port: ${PORT:8080}
  error:
    # Never expose stack traces or server exception messages through Spring's default error attributes
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: lorry-owner-backend

  datasource:
    # Database credentials read strictly from environment variables
    # Supports either DB_USERNAME/DB_PASSWORD or DB_USER/DB_PASS
    url: ${DB_URL:jdbc:mysql://localhost:3306/lorry_fleet_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:${DB_USER:root}}
    password: ${DB_PASSWORD:${DB_PASS:}}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      connection-timeout: 20000
      pool-name: LorryOwnerHikariCP

  jpa:
    open-in-view: false
    hibernate:
      # Conservative schema management:
      # 'validate' strictly checks that existing tables match entity definitions without modifying schema.
      # Never use 'create', 'create-drop', or destructive schema changes in production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: false
        show_sql: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

app:
  document:
    upload-dir: ${DOCUMENT_UPLOAD_DIR:uploads/documents}

# Spring Boot Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # Do not expose sensitive internal component details publicly
      show-details: when_authorized

# JWT Configuration
jwt:
  # Secret key for signing tokens (minimum 256 bits / 32 characters)
  # Uses environment variable JWT_SECRET if defined, or consistent development fallback key
  secret: ${JWT_SECRET:bhp-logistics-fleet-manager-dev-jwt-secret-key-min-32-bytes!}
  # Token validity in milliseconds (default: 7 days = 604,800,000 ms)
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

# Initial Owner Bootstrap Configuration
# When backend starts: if no OWNER account exists and credentials are provided,
# the bootstrap service creates the first owner with BCrypt hashed password.
# Refuses to overwrite existing owners; does not run if credentials missing.
bootstrap:
  owner:
    username: ${INITIAL_OWNER_USERNAME:}
    password: ${INITIAL_OWNER_PASSWORD:}
    full-name: ${INITIAL_OWNER_FULL_NAME:Fleet Owner}
    phone-number: ${INITIAL_OWNER_PHONE:}
