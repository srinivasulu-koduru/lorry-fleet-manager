server:
  port: ${PORT:8080}
  error:
    # Never expose stack traces or server exception messages through Spring's default error attributes
    include-stacktrace: never
    include-message: never
    include-binding-errors: never

spring:
  application:
    name: lorry-owner-backend

  datasource:
    # Database credentials read strictly from environment variables
    # Supports DATABASE_URL (standard cloud/Voroa), DB_URL, DB_USERNAME/DB_PASSWORD or DB_USER/DB_PASS
    url: ${DATABASE_URL:${DB_URL:jdbc:postgresql://localhost:5432/bhp_logistics_db}}
    username: ${DATABASE_USERNAME:${DB_USERNAME:${DB_USER:postgres}}}
    password: ${DATABASE_PASSWORD:${DB_PASSWORD:${DB_PASS:}}}
    driver-class-name: org.postgresql.Driver
    hikari:
      # Tuned for 512 MB RAM container (Voroa Free Nano)
      maximum-pool-size: 3
      minimum-idle: 1
      idle-timeout: 30000
      connection-timeout: 30000
      pool-name: LorryOwnerHikariCP
      data-source-properties:
        connectTimeout: 15
        socketTimeout: 30

  data:
    jpa:
      repositories:
        bootstrap-mode: deferred

  jpa:
    open-in-view: false
    hibernate:
      # Conservative schema management:
      # 'validate' strictly checks that existing tables match entity definitions without modifying schema.
      # Never use 'create', 'create-drop', or destructive schema changes in production.
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
        show_sql: false

  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 50MB

app:
  document:
    upload-dir: ${DOCUMENT_UPLOAD_DIR:uploads/documents}

# Spring Boot Actuator configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info
      base-path: /actuator
  endpoint:
    health:
      # Do not expose sensitive internal component details publicly
      show-details: when_authorized

# JWT Configuration
jwt:
  # Secret key for signing tokens (minimum 256 bits / 32 characters)
  # Uses environment variable JWT_SECRET if defined, or consistent development fallback key
  secret: ${JWT_SECRET:bhp-logistics-fleet-manager-dev-jwt-secret-key-min-32-bytes!}
  # Token validity in milliseconds (default: 7 days = 604,800,000 ms)
  expiration-ms: ${JWT_EXPIRATION_MS:604800000}

# Initial Owner Bootstrap Configuration
# When backend starts: if no OWNER account exists and credentials are provided,
# the bootstrap service creates the first owner with BCrypt hashed password.
# If an owner already exists and OWNER_PASSWORD_RESET_ENABLED=true, a safe one-time
# password reset executes for INITIAL_OWNER_USERNAME with a persistent safeguard against repeats.
bootstrap:
  owner:
    username: ${INITIAL_OWNER_USERNAME:}
    password: ${INITIAL_OWNER_PASSWORD:}
    full-name: ${INITIAL_OWNER_FULL_NAME:Fleet Owner}
    phone-number: ${INITIAL_OWNER_PHONE:}
    password-reset-enabled: ${OWNER_PASSWORD_RESET_ENABLED:false}
  second-owner:
    username: ${SECOND_OWNER_USERNAME:}
    password: ${SECOND_OWNER_PASSWORD:}
    full-name: ${SECOND_OWNER_FULL_NAME:Second Fleet Owner}
    phone-number: ${SECOND_OWNER_PHONE:}
